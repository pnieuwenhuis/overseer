# Local PostgreSQL for `overseer serve` during development: `docker compose up -d`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: overseer
      POSTGRES_USER: overseer
      POSTGRES_PASSWORD: overseer
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
